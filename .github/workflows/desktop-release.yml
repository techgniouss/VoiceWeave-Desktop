name: Desktop build and release

# Every push to main that touches the desktop app builds and tests it and uploads the installer as a workflow
# artifact. Pushing a tag such as v0.1.0 also publishes the installer as a GitHub Release.
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-release.yml', 'LICENSE']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed only to create a release on a tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test
        run: |
          dotnet test desktop/tests/VoiceWeave.Core.Tests
          dotnet test desktop/tests/VoiceWeave.Engine.Tests
          dotnet test desktop/tests/VoiceWeave.Win.Tests

      - name: Publish the app (self-contained, so users need no .NET install)
        run: >
          dotnet publish desktop/VoiceWeave.App -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }} -o desktop/publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ env.VERSION }}" desktop\installer\VoiceWeave.iss

      - name: Checksum
        shell: bash
        run: cd desktop/dist && sha256sum VoiceWeaveSetup.exe > VoiceWeaveSetup.exe.sha256 && cat VoiceWeaveSetup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceWeaveSetup
          path: |
            desktop/dist/VoiceWeaveSetup.exe
            desktop/dist/VoiceWeaveSetup.exe.sha256

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/VoiceWeaveSetup.exe desktop/dist/VoiceWeaveSetup.exe.sha256 \
            --title "VoiceWeave $GITHUB_REF_NAME" \
            --notes "Download **VoiceWeaveSetup.exe** and run it. The first launch downloads the speech models (about 1.3 GB). Windows may show an 'unknown publisher' warning because the installer is not code-signed: choose More info, then Run anyway. Verify the download with the .sha256 file."
